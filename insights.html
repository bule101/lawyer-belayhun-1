<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Ethiopic:wght@500;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=8"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0e3b2e"><title>Legal insights | Adv. Belayhun</title><meta name="description" content="Plain-language legal guides on contracts, land, employment, family and business matters in Ethiopia."></head><body><div id="hdr"></div><main id="main">
<div class="page"><div class="wrap"><h1>Legal insights</h1><p class="sub" id="isub">Plain-language guides to common legal questions, written by the office.</p>
<input class="srch" id="q" type="search" placeholder="Search articles" aria-label="Search articles"><div class="chips" id="f" style="margin-top:16px"></div></div></div>
<div class="wrap" style="padding-bottom:30px"><div class="grid3" id="g"></div><p id="none" style="color:var(--mut);display:none">No articles match. Try another word, or <a href="contact.html">ask the office</a>.</p></div>
<section><div class="wrap"><div class="band"><h2>A question not covered here?</h2><a class="btn" href="book.html">Book a consultation</a></div></div></section></main><div id="ftr"></div><script src="js/config.js?v=8"></script><script src="js/api.js?v=8"></script><script src="js/app.js?v=8"></script>
<script>
const A=[["Land","What to check before signing a lease","Read the term, rent review, deposit and exit clauses, and confirm the landlord's right to lease before you sign.","4 min"],
["Labour","If your employer dismisses you","Keep your contract, payslips and the dismissal letter, note the reason given, and seek advice before accepting any settlement.","5 min"],
["Business","Registering a company: the basics","Choose the company form, reserve a name, prepare the founding documents and obtain the licences your activity needs.","6 min"],
["Family","What happens after a divorce petition","An overview of the process, how property and custody are decided, and what documents to prepare.","6 min"],
["Criminal","If you are arrested: your first hours","Stay calm, ask for a lawyer, avoid signing statements you do not understand, and contact a family member.","3 min"],
["Business","Writing a contract that protects you","Name the parties exactly, define the work and price, set deadlines and penalties, and say how disputes are resolved.","5 min"],
["Land","Buying property: documents to verify","Check the title, the seller's identity, outstanding charges and permits before paying any deposit.","5 min"],
["Investment","Foreign investors: what to know first","Understand permitted sectors, licensing steps and the compliance duties that follow registration.","6 min"]];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let cat="All",term="",LIST=A.map(x=>({category:x[0],title:x[1],body:x[2],meta:x[3]+" read"}));
function draw(){const cats=["All",...new Set(LIST.map(a=>a.category))];f.innerHTML=cats.map(c=>'<button class="chip2" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
 g.innerHTML=LIST.map(a=>'<details class="card art" data-c="'+esc(a.category)+'"><summary><small>'+esc(a.category)+'</small><br><b style="font-family:Playfair Display,serif;font-size:25px">'+esc(a.title)+'</b></summary><p style="white-space:pre-line">'+esc(a.body)+'</p><p class="m">'+esc(a.meta)+' · <a href="book.html">Discuss with the advocate</a></p></details>').join("");flt()}
function flt(){let n=0;g.querySelectorAll(".art").forEach(d=>{const ok=(cat==="All"||d.dataset.c===cat)&&d.textContent.toLowerCase().includes(term);d.hidden=!ok;if(ok)n++});none.style.display=n?"none":"block";f.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===cat))}
f.onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;flt()}};q.oninput=()=>{term=q.value.trim().toLowerCase();flt()};
API.articles().then(r=>{if(r&&r.length){LIST=r.map(a=>({...a,meta:Math.max(1,Math.round(a.body.split(/\s+/).length/200))+" min read"}));isub.textContent="Plain-language guides to common legal questions."}draw()}).catch(draw);
</script></body></html>
