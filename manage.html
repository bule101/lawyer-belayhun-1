<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Ethiopic:wght@500;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=8"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0e3b2e"><title>Manage my booking | Adv. Belayhun</title></head><body><div id="hdr"></div><main id="main">
<div class="page"><div class="wrap"><h1>Manage my booking</h1><p class="sub">Enter the reference you received when you booked, and the phone number you used.</p></div></div>
<div class="wrap" style="padding-bottom:50px;max-width:560px"><div class="book"><div class="step on"><div class="fields" style="grid-template-columns:1fr"><label class="f">Booking reference (for example BL-AB12C)<input id="mref" autocomplete="off"></label><label class="f">Phone number<input id="mph" type="tel" autocomplete="tel"></label></div><div class="err" id="merr2" role="alert"></div><div class="foot"><span></span><button class="btn" id="mgo">Find my booking</button></div><div id="mout"></div></div></div></div>
</main><div id="ftr"></div><script src="js/config.js?v=8"></script><script src="js/api.js?v=8"></script><script src="js/app.js?v=8"></script>
<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
async function showB(b){const past=new Date(b.date+"T"+b.time+":00")<new Date();
 mout.innerHTML='<div class="sum" style="margin-top:24px"><div><span>Reference</span><b>'+esc(b.ref)+'</b></div><div><span>Service</span><b>'+esc(b.service)+'</b></div><div><span>When</span><b>'+esc(b.date)+', '+esc(b.time)+'</b></div><div><span>Meeting</span><b>'+esc(b.mode)+'</b></div><div><span>Status</span><b>'+esc(b.status)+'</b></div>'+(b.lawyer?'<div><span>Lawyer</span><b>'+esc(b.lawyer)+'</b></div>':"")+'</div>'+
 (b.status==="cancelled"?'<p class="note">This booking is cancelled. <a href="book.html">Book a new time</a></p>':b.status==="completed"||b.status==="no_show"?'<p class="note">This consultation is finished.</p>':past?'<p class="note">This appointment has passed.</p>':'<div class="row"><button class="btn ghost" id="mc">Cancel this booking</button><a class="btn" href="book.html">Book a different time</a></div><p class="note">To change the time, cancel this booking and choose a new slot. Cancelling is possible up to 2 hours before the appointment.</p>');
 await docsUI(b);if(b.status==="completed")reviewForm();const c=document.getElementById("mc");if(c)c.onclick=async()=>{if(!confirm(T("Cancel this booking?")))return;try{const ok=await API.cancelMine(mref.value,mph.value);if(!ok){merr2.textContent="This booking can no longer be cancelled online. Please call the office.";return}merr2.textContent="";showB(await API.lookup(mref.value,mph.value))}catch(e){merr2.textContent=e.message}}}
async function docsUI(b){const open=b.status==="pending"||b.status==="confirmed";let l=[];try{l=await API.myDocs(mref.value,mph.value)}catch(e){}
 if(!open&&!l.length)return;
 mout.insertAdjacentHTML("beforeend",'<div class="sum" id="dbox" style="margin-top:20px;display:block"><h3 style="font-size:24px">Documents</h3><div>'+(l.length?l.map(x=>'<div class="row" style="justify-content:space-between;padding:4px 0"><span>'+esc(x.filename)+'</span>'+(open?'<button class="btn sm ghost" data-x="'+esc(x.id)+'">Remove</button>':"")+'</div>').join(""):'<p class="note">No documents attached.</p>')+'</div>'+(open&&l.length<5?'<p class="note">PDF, JPG, PNG or DOCX, up to 2 MB each, maximum 5. Only the advocate handling your matter can open them.</p><input type="file" id="mfile" multiple accept=".pdf,.jpg,.jpeg,.png,.docx"> <button class="btn sm" id="mupl" type="button">Upload</button><div class="err" id="merr3"></div>':"")+'</div>');
 const box=document.getElementById("dbox"),refresh=async()=>{mout.innerHTML="";await showB(await API.lookup(mref.value,mph.value))};
 box.onclick=async e=>{const x=e.target.closest("button[data-x]");if(!x)return;try{await API.delMyDoc(mref.value,mph.value,x.dataset.x);await refresh()}catch(er){const q=document.getElementById("merr3");if(q)q.textContent=er.message}};
 const up=document.getElementById("mupl");if(up)up.onclick=async()=>{const fs=[...mfile.files];if(!fs.length){merr3.textContent="Choose one or more files first.";return}up.disabled=true;merr3.textContent="";const errs=[];
  for(const f of fs){try{await API.uploadDoc(mref.value,mph.value,await API.readFile(f))}catch(er){errs.push(er.message)}}
  await refresh();if(errs.length){const q=document.getElementById("merr3");if(q)q.textContent=errs.join(" ")}}}
function reviewForm(){let rt=0;mout.insertAdjacentHTML("beforeend",'<div class="sum" style="margin-top:20px;display:block"><h3 style="font-size:26px">How was your consultation?</h3><div class="stars" id="rst" role="group" aria-label="Rating">'+[1,2,3,4,5].map(n=>'<button type="button" class="star" data-n="'+n+'" aria-label="'+n+' out of 5" aria-pressed="false">★</button>').join("")+'</div><label class="f">Name to display (for example, your first name)<input class="in" id="rvn" maxlength="60" style="width:100%"></label><label class="f" style="margin-top:12px">Your review<textarea class="in" id="rvb" rows="4" maxlength="600" style="width:100%"></textarea></label><label style="display:flex;gap:10px;margin:12px 0;font-size:15px;align-items:flex-start"><input type="checkbox" id="rvc" style="margin-top:5px"><span>I agree that my name, rating and comment may be shown on this website after approval.</span></label><div class="err" id="rve" role="alert"></div><button class="btn" id="rvs">Submit review</button></div>');
 const s=document.getElementById("rst");s.onclick=e=>{const b=e.target.closest(".star");if(!b)return;rt=+b.dataset.n;s.querySelectorAll(".star").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.n<=rt))};
 rvs.onclick=async()=>{rve.textContent="";if(!rt)return rve.textContent="Choose a rating.";if(rvn.value.trim().length<2)return rve.textContent="Enter the name to display.";if(rvb.value.trim().length<10)return rve.textContent="Please write at least a short sentence.";if(!rvc.checked)return rve.textContent="Please tick the box to agree.";
  rvs.disabled=true;try{await API.submitReview({ref:mref.value,phone:mph.value,rating:rt,name:rvn.value.trim(),body:rvb.value.trim()});rvs.closest(".sum").innerHTML='<p class="ok" style="margin:0"><b>Thank you.</b> Your review will appear on the website once the office has approved it.</p>'}catch(e){rve.textContent=e.message;rvs.disabled=false}}}
mgo.onclick=async()=>{merr2.textContent="";mout.innerHTML="";if(!mref.value.trim()||!mph.value.trim())return merr2.textContent="Enter your reference and phone number.";mgo.disabled=true;
 try{const b=await API.lookup(mref.value,mph.value);if(!b)merr2.textContent="No booking found. Check the reference and phone number.";else showB(b)}catch(e){merr2.textContent=e.message}mgo.disabled=false};
</script></body></html>
